name: CI

# Pushes to main are covered by the release workflow, which runs the same checks
on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    name: Test on Node.js ${{ matrix.node }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test
